    white-space: normal;

<script type="text/x-red" data-template-name="signalk-client">
  <div class="form-row">
        <label for="node-config-input-hostname"><i class="fa fa-bookmark"></i> Host</label>
        <input type="text" id="node-config-input-hostname">
    </div>
    <div class="form-row">
        <label for="node-config-input-port"><i class="fa fa-bookmark"></i> Port</label>
        <input type="text" id="node-config-input-port">
    </div>
    <div class="form-row">
        <label for="node-input-useTLS"><i class="icon-tag"></i> Use TLS</label>
        <input type="checkbox" id="node-config-input-useTLS" placeholder="Use TLS">
    </div>

    <div class="form-row">
        <label for="node-config-input-username"><i class="fa fa-bookmark"></i> Username</label>
        <input type="text" id="node-config-input-username">
    </div>
    <div class="form-row">
        <label for="node-config-input-password"><i class="fa fa-bookmark"></i> Password</label>
        <input type="text" id="node-config-input-password">
    </div>
    <div class="form-row">
        <label for="node-config-input-token"><i class="fa fa-bookmark"></i> Or Token</label>
        <input type="text" id="node-config-input-token">
    </div>
</script>

<script type="text/x-red" data-help-name="signalk-client">
    <p>
        The Signal K Configuration Node is a common
        node providing access to the Signal K server for all
        other nodes.
    </p>
</script>

<script type="text/javascript">
    "use strict";

    const embeddedClientId = 'sk-embeded-id'

    function isEmbeddedSignalKEditor () {
        const nodeRoot = RED.settings && typeof RED.settings.httpNodeRoot === 'string' ? RED.settings.httpNodeRoot : ''
        if (nodeRoot === '/redApi' || nodeRoot.indexOf('/plugins/signalk-node-red/redApi') === 0) {
            return true
        }

        const path = typeof window !== 'undefined' && window.location && typeof window.location.pathname === 'string'
            ? window.location.pathname
            : ''
        return path.indexOf('/plugins/signalk-node-red/') !== -1 || path.indexOf('/redAdmin') === 0
    }

    function ensureEmbeddedSignalKClient () {
        if (!isEmbeddedSignalKEditor()) {
            return
        }

        let hasClient = false

        RED.nodes.eachConfig(function (n) {
            if (n.id === embeddedClientId) {
                hasClient = true
            }
        })

        if (hasClient) {
            return
        }

        const clientType = RED.nodes.getType('signalk-client')
        if (!clientType) {
            return
        }

        RED.nodes.add({
            id: embeddedClientId,
            _def: clientType,
            type: 'signalk-client',
            users: [],
            valid: true,
            isEmbedded: true
        })
        RED.nodes.dirty(true)
    }

    function assignEmbeddedClientIfMissing (node) {
        if (!node || node.server) {
            return false
        }

        node.server = embeddedClientId
        return true
    }

    RED.events.on('nodes:add', function (node) {
        if (node && typeof node.type === 'string' && node.type.startsWith('signalk-') && node.type !== 'signalk-client') {
            ensureEmbeddedSignalKClient()
            if (assignEmbeddedClientIfMissing(node)) {
                RED.nodes.dirty(true)
            }
        }
    })

    RED.nodes.registerType('signalk-client', {
        category: 'config',
        color: '#a6bbcf',
        defaults: {
          hostname: { value: "localhost" },
          isEmbedded: { value: false },
          port: { value: 3000 },
          useTLS: { value: false },
        },
        credentials: {
            username: { type: "text" },
            password: { type: "password" },
            token: { type: "text" }
        },
        label: function label() {
            return this.isEmbedded ? "Embedded" : this.hostname + ":" + this.port
        },
        // setting hasUsers to false means we don't get a warning on deployment, if/when there is no node referring to this config node.
        hasUsers: false,
        onpaletteremove: function onpaletteremove() {
            RED.nodes.eachConfig(function (n) {
                if (n.id === embeddedClientId) RED.nodes.remove(n.id);
            });
            RED.nodes.dirty(true);
        }
    });
</script>
