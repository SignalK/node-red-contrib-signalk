<style>
.red-ui-help dl.message-properties>dt {
    white-space: normal;
}
</style>

<script type="text/x-red" data-template-name="signalk-client">
  <div class="form-row">
        <label for="node-config-input-hostname"><i class="fa fa-bookmark"></i> Host</label>
        <input type="text" id="node-config-input-hostname">
    </div>
    <div class="form-row">
        <label for="node-config-input-port"><i class="fa fa-bookmark"></i> Port</label>
        <input type="text" id="node-config-input-port">
    </div>
    <div class="form-row">
        <label for="node-input-useTLS"><i class="icon-tag"></i> Use TLS</label>
        <input type="checkbox" id="node-config-input-useTLS" placeholder="Use TLS">
    </div>
    <div class="form-row">
        <label for="node-config-input-username"><i class="fa fa-bookmark"></i> Username</label>
        <input type="text" id="node-config-input-username">
    </div>
    <div class="form-row">
        <label for="node-config-input-password"><i class="fa fa-bookmark"></i> Password</label>
        <input type="text" id="node-config-input-password">
    </div>
</script>

<script type="text/x-red" data-help-name="signalk-client">
    <p>
        The Victron Energy Configuration Node is a common
        node providing access to the system dbus for all
        other nodes.

        The Configuration Node is always automatically (re-)created.
    </p>

    <p>
Like the Venus OS GUI, all of the Node-RED Victron Energy nodes
read and write from and to the <i>dbus</i>. This means that selectable
options are <strong>only available</strong> if they also exist on the
dbus.
    </p>

    <p>
As with other Node-RED nodes, Victron Energy nodes consist of input-
and output nodes, where we consider the input to be fetchable information
supplied from the dbus system. Output nodes can write to the dbus system
and thus alter its settings.
   </p>

   <p>
The source code of the Victron Energy nodes can be found <a
href="https://github.com/victronenergy/node-red-contrib-victron">here</a>.
Please submit issues and feature requests to the issue tracker there.
   </p>

   <p>
Questions can also be asked within the Node-RED space on the Victron Energy community:
<a href="https://community.victronenergy.com/c/node-red/28">https://community.victronenergy.com/c/node-red/28</a>
   </p>
</script>

<script type="text/javascript">
    "use strict";

    RED.nodes.registerType('signalk-client', {
        category: 'config',
        color: '#a6bbcf',
        defaults: {
          hostname: { value: "localhost" },
          port: { value: 3000 },
          useTLS: { value: false },
          username: { value: "" },
          password: { value: "" }
        },
        label: function label() {
            return this.hostname + ":" +this.port
        },
        // setting hasUsers to false means we don't get a warning on deployment, if/when there is no node referring to this config node.
        hasUsers: false,
        onpaletteremove: function onpaletteremove() {
            RED.nodes.eachConfig(function (n) {
                if (n.id === 'signalk-client-id') RED.nodes.remove(n.id);
            });
            RED.nodes.dirty(true);
        }
    });
</script>
