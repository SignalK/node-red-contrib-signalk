<script type="text/javascript">
  RED.nodes.registerType('signalk-aggregate', {
    category: 'Signal K',
    color: '#ffcc01',
    defaults: {
      name: { value: '' },
      topic: { value: '' },
      context: { value: 'vessels.self' },
      paths: { value: [], required: true },
      period: { value: 1000 },
      server: { value: '', type: 'signalk-client', required: true }
    },
    inputs: 1,
    outputs: 1,
    icon: 'bridge.png',
    label: function () {
      return this.name || 'signalk-aggregate'
    },
    paletteLabel: 'aggregate',
    oneditprepare: function () {
      $('#node-input-paths-container').editableList({
        addItem: function (container, i, data) {
          var row = $('<div/>', {
            style: 'display: flex; gap: 8px;'
          }).appendTo(container)

          var pathField = $('<input/>', {
            class: 'node-input-path-value',
            type: 'text',
            placeholder: 'Signal K path',
            style: 'width: 100%;'
          }).appendTo(row)

          var value
          if (data.path && typeof data.path === 'object') {
            value = data.path.path
          } else {
            value = data.path
          }
          if (value !== undefined && value !== null) {
            pathField.val(String(value))
          }
        },
        sortable: true,
        removable: true
      })

      if (this.paths) {
        this.paths.forEach(function (path) {
          $('#node-input-paths-container').editableList('addItem', {
            path: path
          })
        })
      }
    },
    oneditsave: function () {
      var node = this
      var items = $('#node-input-paths-container').editableList('items')
      node.paths = []
      items.each(function () {
        var val = $(this).find('.node-input-path-value').val()
        if (val) {
          val = val.trim()
        }
        if (val) {
          node.paths.push(val)
        }
      })
    }
  })
</script>

<script type="text/x-red" data-template-name="signalk-aggregate">
  <div class="form-row">
    <label for="node-input-server"><i class="icon-tag"></i> Server</label>
    <input type="text" id="node-input-server" placeholder="Server">
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-topic"><i class="icon-tag"></i> Topic</label>
    <input type="text" id="node-input-topic" placeholder="Topic (optional)">
  </div>
  <div class="form-row">
    <label for="node-input-context"><i class="icon-tag"></i> Context</label>
    <input type="text" id="node-input-context" placeholder="vessels.self">
  </div>
  <div class="form-row">
    <label for="node-input-period"><i class="icon-tag"></i> Period (ms)</label>
    <input type="text" id="node-input-period" placeholder="1000">
  </div>
  <div class="form-row" style="margin-bottom:0px;">
    <label><i class="fa fa-list"></i> Paths</label>
  </div>
  <div class="form-row node-input-paths-container-row">
    <ol id="node-input-paths-container"></ol>
  </div>
</script>

<script type="text/x-red" data-help-name="signalk-aggregate">
  <p>Subscribes to multiple Signal K paths. Whenever any one of the configured paths receives a delta, the node fetches the current values of all configured paths via <code>getSelfPath</code> and emits a single message.</p>
  <p>The output message has:</p>
  <ul>
    <li><code>msg.topic</code> &mdash; the input <code>msg.topic</code> if present, otherwise the configured Topic, otherwise the path that triggered the update</li>
    <li><code>msg.payload</code> &mdash; an object mapping each configured path to its current value (or <code>null</code> if not available)</li>
  </ul>
  <p>An input message also triggers an aggregation. The input <code>msg.topic</code> is passed through, and the input <code>msg.payload</code> is included in the output payload under the key <code>input</code>.</p>
</script>
